name: PS4 Build Validation

on:
  push:
    branches: [main]
    paths:
      - "ps4/**"
      - "tools/setup_repo.py"
      - ".github/workflows/ps4-validation.yml"
  pull_request:
    paths:
      - "ps4/**"
      - "tools/setup_repo.py"
      - ".github/workflows/ps4-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository without game assets or submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository metadata
        run: python tools/setup_repo.py --check-metadata
      - name: Check PS4 shell script syntax
        run: |
          set -euo pipefail
          for script in ps4/scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done
      - name: Test toolchain setup safety guards
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/home"

          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  -s) echo Linux ;;' '  -m) echo aarch64 ;;' '  *) exit 2 ;;' 'esac' > "$test_root/bin/uname"
          chmod +x "$test_root/bin/uname"

          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$test_root/home/build" bash ps4/scripts/setup-toolchain.sh >"$test_root/unsupported.log" 2>&1; then
            echo "Expected unsupported host architecture to be rejected." >&2
            exit 1
          fi
          grep -Fq "requires x86_64 Linux" "$test_root/unsupported.log"
          test ! -e "$test_root/home/build"

          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  -s) echo Linux ;;' '  -m) echo x86_64 ;;' '  *) exit 2 ;;' 'esac' > "$test_root/bin/uname"
          chmod +x "$test_root/bin/uname"

          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$test_root/home" bash ps4/scripts/setup-toolchain.sh >"$test_root/home-root.log" 2>&1; then
            echo "Expected HOME itself to be rejected as LR_ROOT." >&2
            exit 1
          fi
          grep -Fq "dedicated directory below HOME" "$test_root/home-root.log"

          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$GITHUB_WORKSPACE" bash ps4/scripts/setup-toolchain.sh >"$test_root/repo-root.log" 2>&1; then
            echo "Expected the repository directory to be rejected as LR_ROOT." >&2
            exit 1
          fi
          grep -Fq "must not be inside the GTA IV repository" "$test_root/repo-root.log"

          ln -s "$test_root/home" "$test_root/home-link"
          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$test_root/home-link" bash ps4/scripts/setup-toolchain.sh >"$test_root/symlink-root.log" 2>&1; then
            echo "Expected a symlinked LR_ROOT to be rejected." >&2
            exit 1
          fi
          grep -Fq "must not be a symbolic link" "$test_root/symlink-root.log"
      - name: Verify required PS4 build scripts
        run: |
          set -euo pipefail
          for script in ps4-env.sh setup-toolchain.sh build-ps4.sh package-ps4.sh make-pkg.sh; do
            test -s "ps4/scripts/$script"
            echo "Found: $script"
          done
          test -s ps4/README.md
          echo "PS4 build documentation found"
