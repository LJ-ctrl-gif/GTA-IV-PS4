name: PS4 Build Validation

on:
  push:
    branches: [main, automation/ps4-runtime-assets]
    paths:
      - "ps4/**"
      - "tools/setup_repo.py"
      - ".github/workflows/ps4-validation.yml"
  pull_request:
    paths:
      - "ps4/**"
      - "tools/setup_repo.py"
      - ".github/workflows/ps4-validation.yml"
  workflow_dispatch:

concurrency:
  group: ps4-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository without game assets or submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository metadata
        run: python tools/setup_repo.py --check-metadata
      - name: Check PS4 shell script syntax
        run: |
          set -euo pipefail
          for script in ps4/scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done
      - name: Verify pinned DXC archive integrity guard
        run: |
          set -euo pipefail
          grep -Fq 'DXC_SHA256="96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1"' ps4/scripts/setup-toolchain.sh
          grep -Fq 'sha256sum --check --status' ps4/scripts/setup-toolchain.sh
          grep -Fq 'sha256:96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1' ps4/DEPENDENCIES.md
      - name: Verify official DXC release archive checksum
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/linux_dxc_2026_09_28.x86_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1" "$archive" \
            | sha256sum --check --status

      - name: Test toolchain setup path validation
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/home"

          # The unsupported host must be rejected before creating LR_ROOT.
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  -s) echo Linux ;;' '  -m) echo aarch64 ;;' '  *) exit 2 ;;' 'esac' > "$test_root/bin/uname"
          chmod +x "$test_root/bin/uname"
          if PATH="$test_root/bin:$PATH" HOME="$test_root/home" LR_ROOT="$test_root/home/unsupported" bash ps4/scripts/setup-toolchain.sh >"$test_root/unsupported.log" 2>&1; then
            echo "Expected unsupported host architecture to be rejected." >&2
            exit 1
          fi
          grep -Fq "requires x86_64 Linux" "$test_root/unsupported.log"
          test ! -e "$test_root/home/unsupported"

          # All remaining checks run with a mocked supported host.
          printf '%s\n' '#!/bin/sh' 'case "$1" in' '  -s) echo Linux ;;' '  -m) echo x86_64 ;;' '  *) exit 2 ;;' 'esac' > "$test_root/bin/uname"
          chmod +x "$test_root/bin/uname"

          if PATH="$test_root/bin:$PATH" HOME="$test_root/home" LR_ROOT="$test_root/home" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/home-root.log" 2>&1; then
            echo "Expected HOME itself to be rejected as LR_ROOT." >&2
            exit 1
          fi
          grep -Fq "dedicated directory below HOME" "$test_root/home-root.log"

          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$GITHUB_WORKSPACE" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/repo-root.log" 2>&1; then
            echo "Expected the repository directory to be rejected as LR_ROOT." >&2
            exit 1
          fi
          grep -Fq "must not be inside the GTA IV repository" "$test_root/repo-root.log"

          if PATH="$test_root/bin:$PATH" HOME="$GITHUB_WORKSPACE/.." LR_ROOT="$GITHUB_WORKSPACE/build-root" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/repo-child.log" 2>&1; then
            echo "Expected an LR_ROOT inside the repository to be rejected." >&2
            exit 1
          fi
          grep -Fq "must not be inside the GTA IV repository" "$test_root/repo-child.log"

          ln -s "$test_root/home" "$test_root/home-link"
          if PATH="$test_root/bin:$PATH" HOME="$test_root" LR_ROOT="$test_root/home-link" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/symlink-root.log" 2>&1; then
            echo "Expected a symlinked LR_ROOT to be rejected." >&2
            exit 1
          fi
          grep -Fq "must not be a symbolic link" "$test_root/symlink-root.log"

          # A repository nested at $LR_ROOT/src/LibertyRecomp is the documented layout.
          nested_root="$(dirname "$GITHUB_WORKSPACE")"
          nested_home="$(dirname "$nested_root")"
          PATH="$test_root/bin:$PATH" HOME="$nested_home" LR_ROOT="$nested_root" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/nested-layout.log" 2>&1
          grep -Fq "PS4 toolchain path preflight passed" "$test_root/nested-layout.log"

          # Refuse symlinks and regular files in managed paths before creating any other output.
          mkdir -p "$test_root/home/managed/host-tools"
          ln -s "$test_root/home" "$test_root/home/managed/oo"
          if PATH="$test_root/bin:$PATH" HOME="$test_root/home" LR_ROOT="$test_root/home/managed" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/managed-symlink.log" 2>&1; then
            echo "Expected a symlinked managed directory to be rejected." >&2
            exit 1
          fi
          grep -Fq "refusing symlinked managed path" "$test_root/managed-symlink.log"
          test ! -e "$test_root/home/managed/host-tools/bin"

          rm "$test_root/home/managed/oo"
          touch "$test_root/home/managed/host-tools/dxc"
          if PATH="$test_root/bin:$PATH" HOME="$test_root/home" LR_ROOT="$test_root/home/managed" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/managed-file.log" 2>&1; then
            echo "Expected a regular-file collision to be rejected." >&2
            exit 1
          fi
          grep -Fq "managed path exists but is not a directory" "$test_root/managed-file.log"

          touch "$test_root/home/root-file"
          if PATH="$test_root/bin:$PATH" HOME="$test_root/home" LR_ROOT="$test_root/home/root-file" bash ps4/scripts/setup-toolchain.sh --preflight-only >"$test_root/root-file.log" 2>&1; then
            echo "Expected a non-directory LR_ROOT to be rejected." >&2
            exit 1
          fi
          grep -Fq "LR_ROOT exists but is not a directory" "$test_root/root-file.log"
      - name: Verify build preflight fails safely when dependencies are absent
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p "$test_root/home"

          # The read-only checker must report missing dependencies without creating LR_ROOT.
          if HOME="$test_root/home" LR_ROOT="$test_root/home/check-root" \
             DOLPHIN_BUILD="$test_root/dolphin" OPENORBIS="$test_root/openorbis" \
             bash ps4/scripts/check-build-prerequisites.sh >"$test_root/check.log" 2>&1; then
            echo "Expected prerequisite checker to reject the empty fixture." >&2
            exit 1
          fi
          grep -Fq "PS4 build preflight failed" "$test_root/check.log"
          test ! -e "$test_root/home/check-root"

          # Setup must detect missing upstream inputs before creating a staging directory or downloading DXC.
          if HOME="$test_root/home" LR_ROOT="$test_root/home/setup-root" \
             DOLPHIN_BUILD="$test_root/dolphin" OPENORBIS="$test_root/openorbis" \
             bash ps4/scripts/setup-toolchain.sh >"$test_root/setup.log" 2>&1; then
            echo "Expected toolchain setup to reject the empty fixture." >&2
            exit 1
          fi
          grep -Fq "Aborting before toolchain staging or downloads" "$test_root/setup.log"
          test ! -e "$test_root/home/setup-root/.toolchain-stage"
      - name: Check Mesa source preparation script
        run: |
          set -euo pipefail
          bash -n ps4/scripts/prepare-mesa-source.sh
          grep -Fq '888ff3e913801c0c2b2531ddf4f767772ed45dd9' ps4/scripts/prepare-mesa-source.sh
          grep -Fq 'mesa-26.0.8' ps4/scripts/prepare-mesa-source.sh
          grep -Fq '60e95b787857afbc9a00b693b91c0d9c8923a430' ps4/scripts/prepare-mesa-source.sh
          grep -Fq '60e95b787857afbc9a00b693b91c0d9c8923a430' ps4/DEPENDENCIES.md
          grep -Fq 'git -C "$STAGE/mesa-src" apply --check' ps4/scripts/prepare-mesa-source.sh
          grep -Fq 'git -C "$STAGE/mesa-src" apply -p3 "$MESA_PATCH"' ps4/scripts/prepare-mesa-source.sh
          grep -Fq 'refuses to overwrite existing targets' ps4/DEPENDENCIES.md
      - name: Check package staging safety
        run: |
          set -euo pipefail
          bash -n ps4/scripts/package-ps4.sh
          grep -Fq 'mktemp -d "$LR_ROOT/build/pkg-stage.XXXXXX"' ps4/scripts/package-ps4.sh
          grep -Fq 'refusing to package without the validated OELF' ps4/scripts/package-ps4.sh
          grep -Fq 'output directory must not be a symlink' ps4/scripts/package-ps4.sh
          grep -Fq 'symbol directory must not be a symlink' ps4/scripts/package-ps4.sh
          if grep -Fq 'rm -rf "$STAGE"' ps4/scripts/package-ps4.sh; then
            echo "Unsafe fixed package staging deletion remains." >&2
            exit 1
          fi
          grep -Fq 'rm -rf -- "$STAGE"' ps4/scripts/package-ps4.sh

      - name: Apply pinned Mesa PS4 patches against upstream source
        env:
          LR_ROOT: ${{ runner.temp }}/gta4-lr-root
          DOLPHIN_BUILD: ${{ runner.temp }}/gta4-dolphin-build
        run: |
          set -euo pipefail
          bash ps4/scripts/prepare-mesa-source.sh
          echo "The preparation script validated both immutable source commits and all PS4 patch markers."

      - name: Check pinned Mesa build wrapper
        run: |
          set -euo pipefail
          bash -n ps4/scripts/build-mesa.sh
          grep -Fq '888ff3e913801c0c2b2531ddf4f767772ed45dd9' ps4/scripts/build-mesa.sh
          grep -Fq '60e95b787857afbc9a00b693b91c0d9c8923a430' ps4/scripts/build-mesa.sh
          grep -Fq 'scripts/build-mesa.sh' ps4/scripts/build-mesa.sh
          grep -Fq 'LR_ROOT/mesa-build' ps4/scripts/build-mesa.sh
          grep -Fq 'build-mesa.sh setup' ps4/DEPENDENCIES.md

      - name: Verify Mesa static runtime archive handling
        run: |
          set -euo pipefail
          grep -Fq 'libertyrecomp-ps4-build/mesa-build' cmake/PS4Runtime.cmake
          # RADV's archive already contains Vulkan runtime and WSI objects.
          # The preflight checks their generated archives, but the linker must
          # not add them again or it creates duplicate Vulkan symbols.
          for library in libvulkan_instance.a libvulkan_runtime.a libvulkan_wsi.a; do
            grep -Fq "$library" ps4/scripts/check-build-prerequisites.sh
            if grep -Fq "$library" cmake/PS4Runtime.cmake; then
              echo "Do not link duplicate Mesa runtime archive: $library" >&2
              exit 1
            fi
          done
          grep -Fq 'src/amd/vulkan/libvulkan_radeon.a' cmake/PS4Runtime.cmake
      - name: Verify Mesa source provenance checks
        run: |
          set -euo pipefail
          grep -Fq "is_ps4 = cc.get_define('__ORBIS__') != ''" ps4/scripts/check-build-prerequisites.sh
          grep -Fq "ac_ps4_drm.c" ps4/scripts/check-build-prerequisites.sh
          grep -Fq 'mubuf_addr64_global' ps4/scripts/check-build-prerequisites.sh
          grep -Fq 'patches/mesa-ps4.patch' ps4/DEPENDENCIES.md
          grep -Fq 'mesa-aco-mubuf-addr64.patch' ps4/DEPENDENCIES.md
      - name: Verify required PS4 build scripts
        run: |
          set -euo pipefail
          for script in ps4-env.sh setup-toolchain.sh prepare-mesa-source.sh build-mesa.sh check-build-prerequisites.sh build-ps4.sh package-ps4.sh make-pkg.sh; do
            test -s "ps4/scripts/$script"
            echo "Found: $script"
          done
          test -s ps4/README.md
          echo "PS4 build documentation found"
